<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANYA ♡</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 20% 20%, #ff4f9a55, transparent 35%),
        radial-gradient(circle at 80% 80%, #8b5cf655, transparent 35%),
        linear-gradient(135deg,#07000f,#1c002d,#05000c);
}

/* STARS */

.stars{
    position:fixed;
    inset:0;

    background-image:
        radial-gradient(white 1px,transparent 1px),
        radial-gradient(#ffffffaa 1px,transparent 1px);

    background-size:70px 70px,120px 120px;
    background-position:0 0,40px 60px;

    opacity:.4;
    pointer-events:none;
}

/* FALLING HEARTS */

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.heart{
    position:absolute;
    top:-50px;
    animation:fall linear infinite;
    opacity:.75;
}

@keyframes fall{

    0%{
        transform:translateY(-50px) rotate(0deg);
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
    }

}

/* CARD */

.card{

    position:relative;
    z-index:5;

    width:min(430px,90%);

    padding:40px 30px;

    text-align:center;

    border-radius:32px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.25);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.25);
}

/* BIG HEART */

.big-heart{

    font-size:65px;

    margin-bottom:10px;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}

/* MANYA */

.name{

    font-size:48px;

    font-weight:bold;

    letter-spacing:10px;

    margin-bottom:10px;

    background:
        linear-gradient(
            90deg,
            #ff75b8,
            #ffffff,
            #c38cff
        );

    -webkit-background-clip:text;

    color:transparent;
}

.subtitle{

    font-size:12px;

    letter-spacing:4px;

    opacity:.75;

    margin-bottom:30px;
}

.description{

    line-height:1.7;

    font-size:15px;

    opacity:.85;

    margin-bottom:25px;
}

/* INPUT */

input{

    width:100%;

    padding:16px 18px;

    margin-bottom:15px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.25);

    outline:none;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    transition:.3s;
}

input:focus{

    border-color:#ff72b5;

    box-shadow:0 0 20px rgba(255,90,160,.25);
}

input::placeholder{
    color:#ffffff88;
}

/* BUTTON */

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:16px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff4f9a,
            #8b5cf6
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:.25s;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 15px 35px rgba(255,79,154,.35);
}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;
}

/* STATUS */

#status{

    margin-top:20px;

    min-height:25px;

    font-size:14px;

    line-height:1.6;
}

/* FOOTER */

.footer{

    margin-top:25px;

    font-size:12px;

    opacity:.55;

    letter-spacing:1px;
}

/* MOBILE */

@media(max-width:500px){

    .card{
        padding:35px 22px;
    }

    .name{
        font-size:38px;
        letter-spacing:7px;
    }

}

</style>
</head>


<body>

<!-- STAR FIELD -->
<div class="stars"></div>

<!-- FALLING HEARTS -->
<div class="hearts" id="hearts"></div>


<!-- MAIN CARD -->

<div class="card">

    <div class="big-heart">
        ❤️
    </div>

    <div class="name">
        MANYA
    </div>

    <div class="subtitle">
        100 THINGS ABOUT YOU ✦
    </div>

    <div class="description">

        A little journey made just for you. ✨

        <br><br>

        Before we begin the 100 questions,
        let's make sure everything is working. 💌

    </div>


    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        autocomplete="off"
    >


    <button id="sendButton">
        Send Test Email 💌
    </button>


    <div id="status"></div>


    <div class="footer">
        Made with ♡ for MANYA
    </div>

</div>


<script>

/* ==========================================
   EMAILJS INITIALIZATION
========================================== */

emailjs.init({

    publicKey: "30lIG9UiEcOgq1reY"

});


/* ==========================================
   SEND EMAIL
========================================== */

const sendButton =
    document.getElementById("sendButton");

const status =
    document.getElementById("status");


sendButton.addEventListener(
    "click",
    function(){

        const name =
            document
            .getElementById("name")
            .value
            .trim();


        if(!name){

            status.innerHTML =
                "Please enter your name ❤️";

            return;

        }


        sendButton.disabled = true;

        status.innerHTML =
            "Sending... 💌";


        /* DATA SENT TO EMAILJS */

        const templateParams = {

            name: name,

            message:
                "Hello from the MANYA website ❤️",

            title:
                "MANYA Website Test",

            time:
                new Date().toLocaleString()

        };


        /* EMAILJS */

        emailjs.send(

            "0604200904112009",

            "template_un75izi",

            templateParams

        )

        .then(

            function(response){

                console.log(
                    "Email sent:",
                    response.status,
                    response.text
                );


                status.innerHTML =
                    "💖 Sent successfully!<br>" +
                    "Check your Gmail.";

                sendButton.disabled = false;

            }

        )

        .catch(

            function(error){

                console.error(
                    "EmailJS Error:",
                    error
                );


                status.innerHTML =
                    "❌ Something went wrong.<br>" +
                    "Please check your EmailJS settings.";

                sendButton.disabled = false;

            }

        );

    }
);


/* ==========================================
   FALLING HEARTS
========================================== */

const heartContainer =
    document.getElementById("hearts");


const symbols = [
    "❤️",
    "💗",
    "💕",
    "💖",
    "💜",
    "✨",
    "♡"
];


for(let i = 0; i < 40; i++){

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    heart.innerText =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "%";


    heart.style.fontSize =
        (12 + Math.random() * 18) + "px";


    heart.style.animationDuration =
        (5 + Math.random() * 8) + "s";


    heart.style.animationDelay =
        Math.random() * 8 + "s";


    heartContainer.appendChild(heart);

}

</script>

</body>
</html>
